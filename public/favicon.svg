<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gold gradient background circle -->
  <defs>
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F4E4C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="50" fill="url(#goldGradient)"/>
  
  <!-- Inner circle for depth -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#B8941E" stroke-width="1" opacity="0.3"/>
  
  <!-- La Grandezza initials -->
  <text x="50" y="58" 
        font-family="Georgia, serif" 
        font-size="48" 
        font-weight="bold" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="middle"
        style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3)">LG</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
</svg>
